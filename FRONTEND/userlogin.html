<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAAMKAAJ Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        
        .toggle-container {
            display: flex;
            background: #f0f2f5;
            padding: 5px;
            border-radius: 8px;
            margin-bottom: 25px;
            position: relative;
        }

        .toggle-label {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: color 0.3s;
            z-index: 1;
        }

       
        #worker-tab:checked ~ .toggle-container .label-worker,
        #user-tab:checked ~ .toggle-container .label-user {
            color: #fff;
        }

        .toggle-bg {
            position: absolute;
            top: 5px;
            left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            border-radius: 6px;
            transition: transform 0.3s ease;
            z-index: 0;
        }

        #worker-tab:checked ~ .toggle-container .toggle-bg {
            background: #0056b3;
            transform: translateX(0);
        }

        #user-tab:checked ~ .toggle-container .toggle-bg {
            background: #28a745;
            transform: translateX(100%);
        }

       
        .form-section {
            display: none;
        }

        #worker-tab:checked ~ #worker-section,
        #user-tab:checked ~ #user-section {
            display: block;
        }

        
        .form-group {
            margin-bottom: 15px;
        }

        .form-group.row {
            display: flex;
            gap: 10px;
        }

        .form-group.row > div {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #666;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-worker { background: #0056b3; }
        .btn-user { background: #28a745; }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #888;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ddd;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

       
        .tab-input {
            display: none;
        }
        .workers{
            text-decoration: none;
            color: white;
        }
        .login{
            text-decoration: none;
            color: white;
        }
        .userlog{
            text-decoration: none;
            color: white;
        }
        .usersign{
            text-decoration: none;
            color: white;
        }
        .kaamkaaj{
            color: #28a745;
        }
        .kaam{
            padding-left: 70px;
        }
    </style>
</head>
<body>



    <div class="container">
        <div class="start">
            <img src="./images/kaamkaaj_logo_blue_v2.svg" alt="" height="200px" width="400px" class="kaam">
        </div>
        <input type="radio" id="worker-tab" name="portal-switch" class="tab-input" checked>
        <input type="radio" id="user-tab" name="portal-switch" class="tab-input">
        <div class="toggle-container">
            <div class="toggle-bg"></div>
            <label for="worker-tab" class="toggle-label label-worker">Worker Portal</label>
            <label for="user-tab" class="toggle-label label-user">User Portal</label>
        </div>

        <div id="worker-section" class="form-section">
            <h2>Worker Login</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="w-email">Worker Phone number / (ಕೆಲಸಗಾರರ ದೂರವಾಣಿ ಸಂಖ್ಯೆ)</label>
                    <input type="text" id="w-email" required placeholder="Enter Phone number">
                </div>
                <div class="form-group">
                    <label for="w-password">Password / (ಗುಪ್ತಪದ)</label>
                    <input type="password" id="w-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-worker">
                    <a href="" class="login">
                        Log In  /  (ಲಾಗಿನ್)
                    </a>
                </button>
            </form>

            <div class="divider">OR SIGN UP / (ಅಥವಾ ನೋಂದಾಯಿಸಿ)</div>

            <form action="#" method="POST">
                <div class="form-group row">
                    <div>
                        <label for="w-fname"> Name / (ಹೆಸರು)</label>
                        <input type="text" id="w-fname" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="w-reg-email">Phone Number / (ದೂರವಾಣಿ ಸಂಖ್ಯೆ)</label>
                    <input type="email" id="w-reg-email" required>
                </div>
                <div class="form-group">
                    <label for="w-reg-password">Create Password / (ಗುಪ್ತಪದವನ್ನು ರಚಿಸಿ)</label>
                    <input type="password" id="w-reg-password" required placeholder="">
                </div>
                <button type="submit" class="btn btn-worker">
                    <a href="" class="workers">
                        Register as Worker / (ಕೆಲಸಗಾರರಾಗಿ ನೋಂದಾಯಿಸಿ)
                    </a>
                </button>
            </form>
        </div>

        <!-- USER SECTION -->
        <div id="user-section" class="form-section">
            <div>
                <h1>Welcome to <span class="kaamkaaj">KAAMKAAJ</span></h1>
            </div>
            <br>
            <h2>User Login</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="u-email">Email / Username</label>
                    <input type="text" id="u-email" required placeholder="Enter email or username">
                </div>
                <div class="form-group">
                    <label for="u-password">Password</label>
                    <input type="password" id="u-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-user">
                    <a href="" class="userlog">Log  In</a>
                </button>
            </form>

            <div class="divider">OR SIGN UP</div>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="u-name">Full name</label>
                    <input type="text" id="u-name" required>
                </div>
                <div class="form-group">
                    <label for="u-reg-email">Email Address</label>
                    <input type="email" id="u-reg-email" required>
                </div>
                <div class="form-group">
                    <label for="u-phone">Phone Number</label>
                    <input type="tel" id="u-phone" required placeholder="123-456-7890">
                </div>
                <div class="form-group">
                    <label for="u-reg-password">Create Password</label>
                    <input type="password" id="u-reg-password" required placeholder="Min. 6 characters">
                </div>
                <button type="submit" class="btn btn-user">
                    <a href="" class="usersign">Create User Account</a>
                </button>
            </form>
        </div>

    </div>

</body>
</html>
