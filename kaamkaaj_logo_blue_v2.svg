<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <rect width="640" height="200" fill="#FFFFFF"/>

  <!-- Icon: abstract rounded-square K mark with house notch -->
  <g transform="translate(30,30)">
    <rect x="0" y="0" width="140" height="140" rx="34" fill="url(#blueGrad2)"/>
    <!-- roof notch cut as negative space -->
    <path d="M70 26 L104 56 V58 H36 V56 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- abstract K made of two strokes -->
    <rect x="46" y="70" width="14" height="52" rx="7" fill="#FFFFFF"/>
    <path d="M60 96 L94 70 a8 8 0 1 1 10 12 L76 96 L104 118 a8 8 0 1 1 -10 12 L60 100 Z" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark, no overlap, generous letter spacing -->
  <text x="195" y="95" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="46" font-weight="700" letter-spacing="1" fill="#111827">
    Kaam<tspan fill="#1E40AF">Kaaj</tspan>
  </text>

  <!-- Tagline -->
  <text x="197" y="125" font-family="'Segoe UI', sans-serif" font-size="15" letter-spacing="4" fill="#6B7280">HOUSEHOLD SERVICES</text>

  <!-- accent dot -->
  <circle cx="600" cy="60" r="7" fill="#3B82F6"/>
</svg>
