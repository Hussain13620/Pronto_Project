<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="contactstyle.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="navbar">
                <a href="home.html" class="logo">
                    <img src="../images/kaamkaaj_logo_green_v2.svg" alt="KaamKaaj Logo" height="70px" height="200px">
                </a>

                <nav class="nav-links">
                    <a href="home.html">Home</a>
                    <a href="moksh_homeservices.html">Services</a>
                    <a href="#about">About</a>
                    <a href="" class="active">Contact</a>
                </nav>

                <div class="nav-buttons">
                    <a href="login.html" class="login-btn">Login</a>
                    <a href="signup.html" class="signup-btn">Sign Up</a>
                </div>

                <button class="menu-btn" id="menuBtn">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>

            <!-- Mobile Dropdown Menu -->
            <div class="mobile-menu" id="mobileMenu">
                <a href="home.html">Home</a>
                <a href="#services">Services</a>
                <a href="#about" class="active">About</a>
                <a href="">Contact</a>
                <div class="mobile-auth-buttons">
                    <a href="login.html" class="login-btn">Login</a>
                    <a href="signup.html" class="signup-btn">Sign Up</a>
                </div>
            </div>
        </header>

        <main class="container">
            <form class="form">
                <div class="form-content">
                    <h1>CONTACT US</h1>
                    
                    <label for="name">Name</label>
                    <input id="name" type="text" placeholder="Enter your name">
                    
                    <label for="email">Phone no</label>
                    <input id="email" type="tel" placeholder="Enter your phone number">
                    
                    <label for="problem">Describe your problem</label>
                    <textarea id="problem" placeholder="Enter your problem your facing"></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
        </main>


    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('active');
            const icon = menuBtn.querySelector('i');
            if (mobileMenu.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        });
    </script>

    <footer class="footer" id="contact">

        <div class="footer-logo">
            <div>
                <img src="../images/kaamkaaj_logo_navy_bg.svg" alt="" height="70px" height="200px">
            </div>

        </div>


        <div class="footer-links">

            <a href="#">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>

        </div>

    </footer>

    </div>
</body>
</html>
