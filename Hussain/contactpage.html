<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="contactstyle.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="navbar">
                <a href="home.html" class="logo">
                    <img src="../images/kaamkaaj_logo_green_v2.svg" alt="KaamKaaj Logo" height="70px" height="200px">
                </a>
                <nav class="nav-links">
                    <a href="home.html">Home</a>
                    <a href="moksh_homeservices.html">Services</a>
                    <a href="about.html">About</a>
                    <a href="" class="active">Contact</a>
                </nav>

                <div class="nav-buttons">
                    <a href="login.html" class="login-btn">Login</a>
                    <a href="signup.html" class="signup-btn">Sign Up</a>
                </div>

                <button class="menu-btn" id="menuBtn">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>

            <!-- Mobile Dropdown Menu -->
            <div class="mobile-menu" id="mobileMenu">
                <a href="home.html">Home</a>
                <a href="#services">Services</a>
                <a href="#about" class="active">About</a>
                <a href="">Contact</a>
                <div class="mobile-auth-buttons">
                    <a href="login.html" class="login-btn">Login</a>
                    <a href="signup.html" class="signup-btn">Sign Up</a>
                </div>
            </div>
        </header>

        <main class="container">
            <form class="form" id="contact-form">
                <div class="form-content">
                    <h1>CONTACT US</h1>
                    
                    <label for="name">Name</label>
                    <input id="name" type="text" placeholder="Enter your name" required>
                    
                    <label for="phone">Phone no</label>
                    <input id="phone" type="tel" placeholder="Enter your phone number" required>
                    
                    <label for="problem">Describe your problem</label>
                    <textarea id="problem" placeholder="Enter your problem your facing" required></textarea>
                </div>
                <button type="submit" id="contact-submit-btn">Submit</button>
            </form>
            <div id="status-message" style="display:none; max-width: 500px; margin: 15px auto;"></div>
        </main>


    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('active');
            const icon = menuBtn.querySelector('i');
            if (mobileMenu.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        });
    </script>

    <footer class="footer" id="contact">

        <div class="footer-logo">
            <div>
                <img src="../images/kaamkaaj_logo_navy_bg.svg" alt="" height="70px" height="200px">
            </div>

        </div>


        <div class="footer-links">

            <a href="home.html">Home</a>
            <a href="moksh_homeservices.html">Services</a>
            <a href="packages.html">Packages</a>
            <a href="about.html">About</a>
            <a href="contactpage.html">Contact</a>

        </div>

    </footer>

    </div>

<script type="py">
import js
import json
from pyscript import when
from pyodide.http import pyfetch
from pyodide.ffi import create_proxy

def is_logged_in():
    return js.window.localStorage.getItem("loggedIn") == "true"

def handle_logout(event):
    event.preventDefault()
    js.window.localStorage.removeItem("loggedIn")
    js.window.localStorage.removeItem("userName")
    js.window.localStorage.removeItem("userType")
    js.window.location.reload()

def update_nav():
    if is_logged_in():
        # Update desktop nav buttons
        nav_buttons = js.document.querySelector(".nav-buttons")
        if nav_buttons:
            nav_buttons.innerHTML = '<a href="#" id="logout-btn" class="signup-btn">Logout</a>'
            logout_btn = js.document.getElementById("logout-btn")
            if logout_btn:
                logout_proxy = create_proxy(handle_logout)
                logout_btn.addEventListener("click", logout_proxy)
        # Update mobile menu auth buttons
        mobile_auth = js.document.querySelector(".mobile-auth-buttons")
        if mobile_auth:
            mobile_auth.innerHTML = '<a href="#" id="mobile-logout-btn" class="signup-btn">Logout</a>'
            mobile_logout = js.document.getElementById("mobile-logout-btn")
            if mobile_logout:
                mobile_proxy = create_proxy(handle_logout)
                mobile_logout.addEventListener("click", mobile_proxy)

update_nav()

@when("click", "#contact-submit-btn")
async def handle_contact_submit(event):
    event.preventDefault()
    name_val = js.document.getElementById("name").value.strip()
    phone_elem = js.document.getElementById("phone") or js.document.getElementById("email")
    phone_val = phone_elem.value.strip() if phone_elem else ""
    problem_val = js.document.getElementById("problem").value.strip()

    status_box = js.document.getElementById("status-message")

    if not name_val or not phone_val or not problem_val:
        if status_box:
            status_box.style.backgroundColor = "#dc3545"
            status_box.style.color = "white"
            status_box.style.padding = "10px 15px"
            status_box.style.borderRadius = "6px"
            status_box.style.marginTop = "15px"
            status_box.style.textAlign = "center"
            status_box.innerText = "❌ Please fill out all fields!"
            status_box.style.display = "block"
        return

    payload = {
        "name": name_val,
        "phone_number": phone_val,
        "description": problem_val
    }

    try:
        response = await pyfetch(
            "http://127.0.0.1:8000/contact",
            method="POST",
            headers={"Content-Type": "application/json"},
            body=json.dumps(payload)
        )
        result = await response.json()

        if status_box:
            if response.status == 200 and result.get("status") == "success":
                status_box.style.backgroundColor = "#28a745"
                status_box.style.color = "white"
                status_box.style.padding = "10px 15px"
                status_box.style.borderRadius = "6px"
                status_box.style.marginTop = "15px"
                status_box.style.textAlign = "center"
                status_box.innerText = f"🎉 {result['message']}"
                status_box.style.display = "block"

                js.document.getElementById("name").value = ""
                if phone_elem:
                    phone_elem.value = ""
                js.document.getElementById("problem").value = ""
            else:
                status_box.style.backgroundColor = "#dc3545"
                status_box.style.color = "white"
                status_box.style.padding = "10px 15px"
                status_box.style.borderRadius = "6px"
                status_box.style.marginTop = "15px"
                status_box.style.textAlign = "center"
                status_box.innerText = f"❌ {result.get('message', 'Submission failed')}"
                status_box.style.display = "block"
    except Exception as err:
        if status_box:
            status_box.style.backgroundColor = "#dc3545"
            status_box.style.color = "white"
            status_box.style.padding = "10px 15px"
            status_box.style.borderRadius = "6px"
            status_box.style.marginTop = "15px"
            status_box.style.textAlign = "center"
            status_box.innerText = f"❌ Error: {str(err)}"
            status_box.style.display = "block"
</script>

</body>
</html>
