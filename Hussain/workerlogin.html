<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAAMKAAJ Worker Portal</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.row {
            display: flex;
            gap: 10px;
        }

        .form-group.row > div {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #666;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-worker { background: #0056b3; }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #888;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ddd;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .workers, .login {
            text-decoration: none;
            color: white;
        }
        
        .kaam {
            padding-left: 70px;
        }

        /* Success/Error Status Banner Styling */
        #status-message {
            display: none;
            background-color: #0056b3;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="start">
            <img src="./images/kaamkaaj_logo_blue_v2.svg" alt="Kaamkaaj Logo" height="200px" width="400px" class="kaam">
        </div>

        <div id="status-message"></div>

        <!-- WORKER SECTION -->
        <div id="worker-section">
            <h2>Worker Login</h2>
            <div>
                <div class="form-group">
                    <label for="w-phone">Worker Phone number / (ಕೆಲಸಗಾರರ ದೂರವಾಣಿ ಸಂಖ್ಯೆ)</label>
                    <input type="text" id="w-phone" required placeholder="Enter Phone number">
                </div>
                <div class="form-group">
                    <label for="w-password">Password / (ಗುಪ್ತಪದ)</label>
                    <input type="password" id="w-password" required placeholder="••••••••">
                </div>
                <!-- Changed to type="button" with ID for PyScript -->
                <button type="button" class="btn btn-worker" id="worker-login-btn">
                    <span class="login">Log In / (ಲಾಗಿನ್)</span>
                </button>
            </div>

            <div class="divider">OR SIGN UP / (ಅಥವಾ ನೋಂದಾಯಿಸಿ)</div>

            <div>
                <div class="form-group row">
                    <div>
                        <label for="w-fname">Name / (ಹೆಸರು)</label>
                        <input type="text" id="w-fname" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="w-reg-phone">Phone Number / (ದೂರವಾಣಿ ಸಂಖ್ಯೆ)</label>
                    <input type="text" id="w-reg-phone" required placeholder="10-digit number">
                </div>
                <div class="form-group">
                    <label for="w-reg-password">Create Password / (ಗುಪ್ತಪದವನ್ನು ರಚಿಸಿ)</label>
                    <input type="password" id="w-reg-password" required placeholder="">
                </div>
                <!-- Changed to type="button" with ID for PyScript -->
                <button type="button" class="btn btn-worker" id="worker-signup-btn">
                    <span class="workers">Register as Worker / (ಕೆಲಸಗಾರರಾಗಿ ನೋಂದಾಯಿಸಿ)</span>
                </button>
            </div>
        </div>

    </div>

</body>
</html>

<script type="py">
from pyscript import when
from pyodide.http import pyfetch
import js
import json

@when("click", "#worker-login-btn")
async def handle_worker_login(event):
    phone = js.document.getElementById("w-phone").value
    password = js.document.getElementById("w-password").value
    
    payload = {
        "phone_number": phone,
        "worker_pass": password
    }
    
    response = await pyfetch(
        "http://127.0.0.1:8000/worker-login",
        method="POST",
        headers={"Content-Type": "application/json"},
        body=json.dumps(payload)
    )
    
    result = await response.json()
    print("Worker Login Response:", result)
    
    status_box = js.document.getElementById("status-message")
    if status_box:
        if response.status == 200 and result.get("status") == "success":
            status_box.style.backgroundColor = "#0056b3"
            status_box.innerText = f"🎉 {result['message']}"
            status_box.style.display = "block"
            js.document.getElementById("w-phone").value = ""
            js.document.getElementById("w-password").value = ""
        else:
            status_box.style.backgroundColor = "#dc3545"
            status_box.innerText = f"❌ {result.get('message', 'Login failed')}"
            status_box.style.display = "block"
            js.document.getElementById("w-phone").value = ""
            js.document.getElementById("w-password").value = ""

@when("click", "#worker-signup-btn")
async def handle_worker_signup(event):
    name = js.document.getElementById("w-fname").value
    phone = js.document.getElementById("w-reg-phone").value
    password = js.document.getElementById("w-reg-password").value
    
    payload = {
        "worker_name": name,
        "phone_number": phone,
        "worker_pass": password
    }
    
    response = await pyfetch(
        "http://127.0.0.1:8000/worker-signup",
        method="POST",
        headers={"Content-Type": "application/json"},
        body=json.dumps(payload)
    )
    
    result = await response.json()
    print("Worker Signup Response:", result)
    
    status_box = js.document.getElementById("status-message")
    if status_box:
        if response.status == 200:
            status_box.style.backgroundColor = "#0056b3"
            status_box.innerText = "🎉 Worker registered successfully! You can now log in."
            status_box.style.display = "block"
            js.document.getElementById("w-fname").value = ""
            js.document.getElementById("w-reg-phone").value = ""
            js.document.getElementById("w-reg-password").value = ""
        else:
            status_box.style.backgroundColor = "#dc3545"
            status_box.innerText = "❌ Registration failed. Please try again."
            status_box.style.display = "block"
            js.document.getElementById("w-fname").value = ""
            js.document.getElementById("w-reg-phone").value = ""
            js.document.getElementById("w-reg-password").value = ""
</script>
