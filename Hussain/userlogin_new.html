<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAAMKAAJ User Login</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #666;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-user { background: #28a745; }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #888;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #ddd;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .userlog {
            text-decoration: none;
            color: white;
        }
        .usersign {
            text-decoration: none;
            color: white;
        }
        .kaamkaaj {
            color: #28a745;
        }
        .kaam {
            padding-left: 70px;
        }

        /* Fancy Success Banner Styling */
        #status-message {
            display: none;
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="start">
            <img src="./images/kaamkaaj_logo_blue_v2.svg" alt="" height="200px" width="400px" class="kaam">
        </div>

        <!-- USER SECTION -->
        <div id="user-section">
            <div>
                <h1>Welcome to <span class="kaamkaaj">KAAMKAAJ</span></h1>
            </div>
            <br>
            <div id="status-message"></div>
            <h2>User Login</h2>
            <div>
                <div class="form-group">
                    <label for="u-email">Email</label>
                    <input type="text" id="u-email" required placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label for="u-password">Password</label>
                    <input type="password" id="u-password" required placeholder="••••••••">
                </div>
                <button type="button" class="btn btn-user" id="user-login-btn">
                   <span class="userlog">Log In</span>
                </button>
            </div>

            <div class="divider">OR SIGN UP</div>

            <div>
                <div class="form-group">
                    <label for="u-name">Full name</label>
                    <input type="text" id="u-name" required>
                </div>
                <div class="form-group">
                    <label for="u-reg-email">Email Address</label>
                    <input type="email" id="u-reg-email" required>
                </div>
                <div class="form-group">
                    <label for="u-phone">Phone Number</label>
                    <input type="tel" id="u-phone" required placeholder="1234567890">
                </div>
                <div class="form-group">
                    <label for="u-reg-password">Create Password</label>
                    <input type="password" id="u-reg-password" required placeholder="Min. 6 characters">
                </div>
                <button type="button" class="btn btn-user" id="user-signup-btn">
                    <span class="usersign">Create User Account</span>
                </button>
            </div>
        </div>

    </div>

</body>
</html>

<script type="py">
from pyscript import when
from pyodide.http import pyfetch
import js
import json

@when("click", "#user-login-btn")
async def handle_user_login(event):
    email_input = js.document.getElementById("u-email").value
    password = js.document.getElementById("u-password").value
    
    payload = {
        "email": email_input,
        "password": password
    }
    
    response = await pyfetch(
        "http://127.0.0.1:8000/login",
        method="POST",
        headers={"Content-Type": "application/json"},
        body=json.dumps(payload)
    )
    
    result = await response.json()
    print("Server Response:", result)
    
    status_box = js.document.getElementById("status-message")
    if status_box:
        if response.status == 200 and result.get("status") == "success":
            status_box.style.backgroundColor = "#28a745"
            status_box.innerText = f"🎉 {result['message']}"
            status_box.style.display = "block"
        else:
            status_box.style.backgroundColor = "#dc3545"
            status_box.innerText = f"❌ {result.get('message', 'Login failed')}"
            status_box.style.display = "block"

@when("click", "#user-signup-btn")
async def handle_user_signup(event):
    name = js.document.getElementById("u-name").value
    email = js.document.getElementById("u-reg-email").value
    phone = js.document.getElementById("u-phone").value
    password = js.document.getElementById("u-reg-password").value
    
    payload = {
        "username": name,
        "email": email,
        "phone_no": phone,
        "password": password
    }
    
    response = await pyfetch(
        "http://127.0.0.1:8000/signup",
        method="POST",
        headers={"Content-Type": "application/json"},
        body=json.dumps(payload)
    )
    
    result = await response.json()
    print("Signup Response:", result)
    status_box = js.document.getElementById("status-message")
    
    if response.status == 200:
        status_box.style.backgroundColor = "#28a745"
        status_box.innerText = "🎉 User registered successfully! You can now log in."
        status_box.style.display = "block"
    else:
        status_box.style.backgroundColor = "#dc3545"
        status_box.innerText = "❌ Registration failed. Please try again."
        status_box.style.display = "block"
</script>
