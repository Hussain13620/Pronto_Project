    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('active');
            const icon = menuBtn.querySelector('i');
            if (mobileMenu.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const packageId = urlParams.get('package');
            const serviceId = urlParams.get('service');

            const packageServices = {
                '1': ['sweeping', 'mopping', 'washing_vessels'],
                '2': ['laundry', 'ironing_and_folding', 'dusting'],
                '3': ['kitchen_prep', 'washing_vessels', 'sweeping'],
                '4': ['sweeping', 'mopping', 'dusting', 'balcony_cleaning'],
                '5': ['mopping', 'dusting', 'balcony_cleaning'],
                '6': ['laundry', 'ironing_and_folding', 'washing_vessels'],
                '7': ['balcony_cleaning', 'sweeping', 'kitchen_prep'],
                '8': ['sweeping', 'mopping', 'washing_vessels', 'laundry', 'dusting', 'balcony_cleaning', 'ironing_and_folding', 'kitchen_prep']
            };

            // Handle package pre-selection
            if (packageId && packageServices[packageId]) {
                const servicesToSelect = packageServices[packageId];
                servicesToSelect.forEach(service => {
                    const checkbox = document.querySelector(`input[name="services"][value="${service}"]`);
                    if (checkbox) {
                        checkbox.checked = true;
                    }
                });
            }

            // Handle single service pre-selection from services page
            if (serviceId) {
                const checkbox = document.querySelector(`input[name="services"][value="${serviceId}"]`);
                if (checkbox) {
                    checkbox.checked = true;
                }
            }
        });
    </script>

    <script type="py">
import js
from pyodide.ffi import create_proxy

def is_logged_in():
    return js.window.localStorage.getItem("loggedIn") == "true"

def handle_logout(event):
    event.preventDefault()
    js.window.localStorage.removeItem("loggedIn")
    js.window.localStorage.removeItem("userName")
    js.window.localStorage.removeItem("userType")
    js.window.location.reload()

def update_nav():
    if is_logged_in():
        nav_buttons = js.document.querySelector(".nav-buttons")
        if nav_buttons:
            nav_buttons.innerHTML = '<a href="#" id="logout-btn" class="signup-btn">Logout</a>'
            logout_btn = js.document.getElementById("logout-btn")
            if logout_btn:
                logout_proxy = create_proxy(handle_logout)
                logout_btn.addEventListener("click", logout_proxy)

update_nav()
    </script>
