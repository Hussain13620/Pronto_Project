        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('active');
            const icon = menuBtn.querySelector('i');
            if (mobileMenu.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        });

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const apiBase = window.PRONTO_API_BASE_URL;
            let csrfToken = "";
            try {
                const sessionResponse = await fetch(`${apiBase}/auth/me`, { credentials: "include" });
                const session = await sessionResponse.json();
                if (!sessionResponse.ok || session.role !== "user") {
                    throw new Error("Please sign in with a user account to book a service.");
                }
                csrfToken = session.csrf_token;
            } catch (error) {
                const redirectTarget = "booking_submission.html" + window.location.search;
                window.location.replace("login.html?redirect=" + encodeURIComponent(redirectTarget));
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const packageId = urlParams.get('package');
            const serviceId = urlParams.get('service');

            const packageServices = {
                '1': ['sweeping', 'mopping', 'washing_vessels'],
                '2': ['laundry', 'ironing_and_folding', 'dusting'],
                '3': ['kitchen_prep', 'washing_vessels', 'sweeping'],
                '4': ['sweeping', 'mopping', 'dusting', 'balcony_cleaning'],
                '5': ['mopping', 'dusting', 'balcony_cleaning'],
                '6': ['laundry', 'ironing_and_folding', 'washing_vessels'],
                '7': ['balcony_cleaning', 'sweeping', 'kitchen_prep'],
                '8': ['sweeping', 'mopping', 'washing_vessels', 'laundry', 'dusting', 'balcony_cleaning', 'ironing_and_folding', 'kitchen_prep']
            };

            // Handle package pre-selection
            if (packageId && packageServices[packageId]) {
                const servicesToSelect = packageServices[packageId];
                servicesToSelect.forEach(service => {
                    const checkbox = document.querySelector(`input[name="services"][value="${service}"]`);
                    if (checkbox) {
                        checkbox.checked = true;
                    }
                });
            }

            // Handle single service pre-selection from services page
            if (serviceId) {
                const checkbox = document.querySelector(`input[name="services"][value="${serviceId}"]`);
                if (checkbox) {
                    checkbox.checked = true;
                }
            }

            // Handle booking confirmation popup
            const bookingForm = document.querySelector(".booking-section form");
            const popup = document.getElementById("confirmation-popup");
            const closeBtn = document.getElementById("close-popup-btn");

            if (bookingForm && popup) {
                bookingForm.addEventListener("submit", async (e) => {
                    e.preventDefault();
                    const selectedServices = Array.from(
                        bookingForm.querySelectorAll('input[name="services"]:checked')
                    ).map((input) => input.value);
                    const propertyType = bookingForm.querySelector('input[name="property_type"]:checked');
                    const status = document.getElementById("booking-status");
                    const submitButton = bookingForm.querySelector('button[type="submit"]');

                    if (selectedServices.length === 0) {
                        status.textContent = "Select at least one service.";
                        return;
                    }

                    status.textContent = "";
                    submitButton.disabled = true;
                    try {
                        const response = await fetch(
                            `${apiBase}/service-requests`,
                            {
                                method: "POST",
                                credentials: "include",
                                headers: {
                                    "Content-Type": "application/json",
                                    "X-CSRF-Token": csrfToken
                                },
                                body: JSON.stringify({
                                    services: selectedServices,
                                    property_type: propertyType ? propertyType.value : null
                                })
                            }
                        );
                        const result = await response.json();
                        if (!response.ok) {
                            throw new Error(result.detail || "The booking could not be submitted.");
                        }
                        popup.classList.add("active");
                    } catch (error) {
                        status.textContent = error.message || "Could not submit booking. Check the server connection.";
                    } finally {
                        submitButton.disabled = false;
                    }
                });
            }

            if (closeBtn && popup) {
                closeBtn.addEventListener("click", () => {
                    popup.classList.remove("active");
                    window.location.href = "home.html";
                });
            }
        });
    </script>

    <script type="py">
import js
from pyodide.ffi import create_proxy
from pyodide.http import pyfetch

def is_logged_in():
    return js.window.localStorage.getItem("loggedIn") == "true"

async def handle_logout(event):
    event.preventDefault()
    try:
        await pyfetch("http://127.0.0.1:8000/logout", method="POST", credentials="include")
    except Exception:
        js.window.alert("Could not log out from the server. Please try again.")
        return
    js.window.localStorage.removeItem("loggedIn")
    js.window.localStorage.removeItem("userName")
    js.window.localStorage.removeItem("userType")
    js.window.location.reload()

def update_nav():
    if is_logged_in():
        nav_buttons = js.document.querySelector(".nav-buttons")
        if nav_buttons:
            nav_buttons.innerHTML = '<a href="#" id="logout-btn" class="signup-btn">Logout</a>'
            logout_btn = js.document.getElementById("logout-btn")
            if logout_btn:
                logout_proxy = create_proxy(handle_logout)
                logout_btn.addEventListener("click", logout_proxy)
    else:
        target = js.window.location.pathname.split('/').pop() + js.window.location.search
        js.window.location.replace(f"login.html?redirect={js.encodeURIComponent(target)}")

update_nav()
    </script>
